<g name="content">
<rect x="112" y="88" width="240" height="44" rx="12" fill="#51452A" opacity="1.0"/><text x="132" y="116" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="13" font-weight="500" fill="#F3E1BB" text-anchor="start" letter-spacing="0" opacity="1.0">外观</text><text x="132" y="164" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="13" font-weight="400" fill="#D0C5B4" text-anchor="start" letter-spacing="0" opacity="1.0">游戏</text><text x="132" y="212" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="13" font-weight="400" fill="#D0C5B4" text-anchor="start" letter-spacing="0" opacity="1.0">启动</text><text x="132" y="260" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="13" font-weight="400" fill="#D0C5B4" text-anchor="start" letter-spacing="0" opacity="1.0">下载</text><text x="132" y="308" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="13" font-weight="400" fill="#D0C5B4" text-anchor="start" letter-spacing="0" opacity="1.0">关于</text><rect x="376" y="88" width="700" height="140" rx="24" fill="#1F1B13" opacity="1.0"/><text x="400" y="128" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="14" font-weight="600" fill="#EAE1D4" text-anchor="start" letter-spacing="0" opacity="1.0">主题</text><text x="400" y="150" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="11" font-weight="400" fill="#D0C5B4" text-anchor="start" letter-spacing="0" opacity="1.0">跟随系统时会读取桌面环境的深浅色设置</text><rect x="400" y="166" width="320" height="40" rx="20.0" fill="#2E2921" opacity="1.0"/><rect x="403.0" y="169" width="100.66666666666667" height="34" rx="17.0" fill="#51452A" opacity="1.0"/><text x="453.3333333333333" y="190.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="12" font-weight="500" fill="#F3E1BB" text-anchor="middle" letter-spacing="0" opacity="1.0">跟随系统</text><text x="560.0" y="190.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="12" font-weight="500" fill="#D0C5B4" text-anchor="middle" letter-spacing="0" opacity="1.0">浅色</text><text x="666.6666666666667" y="190.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="12" font-weight="500" fill="#D0C5B4" text-anchor="middle" letter-spacing="0" opacity="1.0">深色</text><rect x="376" y="244" width="700" height="160" rx="24" fill="#1F1B13" opacity="1.0"/><text x="400" y="284" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="14" font-weight="600" fill="#EAE1D4" text-anchor="start" letter-spacing="0" opacity="1.0">从壁纸自动取色</text><text x="400" y="306" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="11" font-weight="400" fill="#D0C5B4" text-anchor="start" letter-spacing="0" opacity="1.0">用 KMeans 抽主色生成整套路色，关闭则只用种子色</text><rect x="1008" y="270" width="44" height="24" rx="12" fill="#E6C26C" opacity="1.0"/><circle cx="1040" cy="282" r="9" fill="#3E2E00"/><circle cx="412" cy="352" r="14" fill="#E6C26C"/><circle cx="452" cy="352" r="14" fill="#D6C5A0"/><circle cx="492" cy="352" r="14" fill="#AFCFAB"/><circle cx="532" cy="352" r="14" fill="#5A4400"/><circle cx="572" cy="352" r="14" fill="#314D32"/><text x="608" y="358" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="11" font-weight="400" fill="#D0C5B4" text-anchor="start" letter-spacing="0" opacity="1.0">当前种子色 #EFDBB2 · 来自「暖金」预设</text><rect x="376" y="420" width="700" height="120" rx="24" fill="#1F1B13" opacity="1.0"/><text x="400" y="460" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="14" font-weight="600" fill="#EAE1D4" text-anchor="start" letter-spacing="0" opacity="1.0">减少动效</text><text x="400" y="482" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="11" font-weight="400" fill="#D0C5B4" text-anchor="start" letter-spacing="0" opacity="1.0">关闭卡片 shape morph、弹簧与页面转场，仅保留淡入</text><rect x="1008" y="446" width="44" height="24" rx="12" fill="#39342B" stroke="#999080" stroke-opacity="0.6"/><circle cx="1020" cy="458" r="9" fill="#999080"/><rect x="376" y="556" width="700" height="130" rx="24" fill="#1F1B13" opacity="1.0"/><text x="400" y="596" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="14" font-weight="600" fill="#EAE1D4" text-anchor="start" letter-spacing="0" opacity="1.0">界面密度</text><text x="400" y="618" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="11" font-weight="400" fill="#D0C5B4" text-anchor="start" letter-spacing="0" opacity="1.0">紧凑会让列表行高从 92 降到 72，一屏多看两行</text><rect x="400" y="634" width="220" height="40" rx="20.0" fill="#2E2921" opacity="1.0"/><rect x="403.0" y="637" width="104.0" height="34" rx="17.0" fill="#51452A" opacity="1.0"/><text x="455.0" y="658.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="12" font-weight="500" fill="#F3E1BB" text-anchor="middle" letter-spacing="0" opacity="1.0">舒适</text><text x="565.0" y="658.0" font-family="'Noto Sans CJK SC','Source Han Sans SC','Inter',sans-serif" font-size="12" font-weight="500" fill="#D0C5B4" text-anchor="middle" letter-spacing="0" opacity="1.0">紧凑</text>
