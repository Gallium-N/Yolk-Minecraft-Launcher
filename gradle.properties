org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# The host default JDK is 25; YMCL builds and runs on JDK 21.
# Machine-specific path (this workstation has Temurin 21, not the distro openjdk package).
org.gradle.java.home=/usr/lib/jvm/java-21-temurin-jdk
org.gradle.java.installations.paths=/usr/lib/jvm/java-21-temurin-jdk

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
