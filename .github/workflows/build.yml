name: build

on:
  push:
    branches: [ci/windows, motion, main]
  workflow_dispatch:

jobs:
  test:
    name: Linux · build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        env:
          GRADLE_OPTS: -Xmx3g
        run: ./gradlew build --no-daemon --stacktrace

  windows-portable:
    name: Windows · portable app-image
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: createDistributable
        shell: bash
        env:
          GRADLE_OPTS: -Xmx3g
        run: ./gradlew :composeApp:createDistributable --no-daemon --stacktrace
      - name: Layout
        shell: pwsh
        run: Get-ChildItem -Recurse -Depth 1 composeApp/build/compose/binaries/main/app | Select-Object FullName
      - name: Write README next to the exe
        shell: pwsh
        run: |
          $app = "composeApp/build/compose/binaries/main/app/YMCL"
          @"
          YMCL portable build
          ===================
          1. Keep this folder intact: YMCL.exe, app\ and runtime\ must stay together.
          2. Put it somewhere WRITABLE (not C:\Program Files) - YMCL creates .YMCL\ next to the exe.
          3. Double-click YMCL.exe.
          4. If it says "Failed to launch JVM", download the *console-debug* artifact instead
             and run YMCL.exe from cmd.exe; it prints the real error.
          "@ | Set-Content -Encoding UTF8 "$app/README-portable.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: YMCL-windows-x64-portable
          path: composeApp/build/compose/binaries/main/app/YMCL
          include-hidden-files: true
          retention-days: 14

  windows-console-debug:
    name: Windows · console debug build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: createDistributable (console)
        shell: bash
        env:
          GRADLE_OPTS: -Xmx3g
        run: ./gradlew :composeApp:createDistributable -Pymcl.console=true --no-daemon --stacktrace
      - name: Check cfg has console flag
        shell: pwsh
        run: Get-Content composeApp/build/compose/binaries/main/app/YMCL/app/YMCL.cfg | Select-String -Pattern "console|mainclass"
      - uses: actions/upload-artifact@v4
        with:
          name: YMCL-windows-x64-console-debug
          path: composeApp/build/compose/binaries/main/app/YMCL
          include-hidden-files: true
          retention-days: 14

  windows-msi:
    name: Windows · MSI installer (best effort)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: packageMsi
        shell: bash
        env:
          GRADLE_OPTS: -Xmx3g
        run: ./gradlew :composeApp:packageMsi --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: YMCL-windows-x64-msi
          path: composeApp/build/compose/binaries/main/pkg/*.msi
          if-no-files-found: warn
          retention-days: 14
