name: build

on:
  push:
    branches: [p8-packaging, ci/windows, motion, main]
    tags: ['v*']
  workflow_dispatch:

# P8 decision addendum (DSH): the four jobs below MUST stay green. The two
# best-effort jobs may fail without blocking. Release only on v* tags.
env:
  GRADLE_OPTS: -Xmx3g

jobs:
  test:
    name: Linux · build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: version
        shell: bash
        run: |
          V=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null | sed 's/^v//')
          V=${V:-1.0.0}
          V=$(echo "$V" | cut -d. -f1-3)
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Build and test
        run: ./gradlew build -Pymcl.version=$VERSION --no-daemon --stacktrace

  windows-portable:
    name: Windows · portable app-image (required)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: version
        shell: bash
        run: |
          V=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null | sed 's/^v//')
          V=${V:-1.0.0}
          V=$(echo "$V" | cut -d. -f1-3)
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: createDistributable
        shell: bash
        run: ./gradlew :composeApp:createDistributable -Pymcl.version=$VERSION --no-daemon --stacktrace
      - name: Layout
        shell: pwsh
        run: Get-ChildItem -Recurse -Depth 1 composeApp/build/compose/binaries/main/app | Select-Object FullName
      - name: Write README next to the exe
        shell: pwsh
        run: |
          $app = "composeApp/build/compose/binaries/main/app/YMCL"
          @"
          YMCL portable build $env:VERSION
          ================================
          1. Keep this folder intact: YMCL.exe, app\ and runtime\ must stay together.
          2. Put it somewhere WRITABLE (not C:\Program Files) - YMCL creates .YMCL\ next to the exe.
          3. Double-click YMCL.exe.
          4. If it says "Failed to launch JVM", download the *console-debug* artifact instead.
          "@ | Set-Content -Encoding UTF8 "$app/README-portable.txt"
      - name: zip + SHA256SUMS
        shell: pwsh
        run: |
          $app = "composeApp/build/compose/binaries/main/app/YMCL"
          $zip = "YMCL-$env:VERSION-win-x64-portable.zip"
          Compress-Archive -Path "$app\*" -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + $zip | Set-Content -Encoding ASCII "SHA256SUMS-portable.txt"
          Get-Content "SHA256SUMS-portable.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: YMCL-windows-x64-portable
          path: |
            YMCL-*-win-x64-portable.zip
            SHA256SUMS-portable.txt
          retention-days: 14

  windows-installer:
    name: Windows · single-file installer (WiX)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: version
        shell: bash
        run: |
          V=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null | sed 's/^v//')
          V=${V:-1.0.0}
          V=$(echo "$V" | cut -d. -f1-3)
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Ensure WiX
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\WiX Toolset v3.14\bin\candle.exe")) {
            choco install wixtoolset -y --no-progress
          }
          Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3.14\bin" -Filter "*.exe" | Select-Object -First 3
      - name: packageExe
        shell: bash
        env:
          GRADLE_OPTS: -Xmx3g
        run: ./gradlew :composeApp:packageExe -Pymcl.version=$VERSION --no-daemon --stacktrace
      - name: Collect artifact
        shell: bash
        run: |
          set -euo pipefail
          ls -l composeApp/build/compose/binaries/main/exe/ || true
          SRC=$(ls composeApp/build/compose/binaries/main/exe/*.exe | head -1)
          cp "$SRC" "YMCL-${VERSION}-win-x64-setup.exe"
          sha256sum "YMCL-${VERSION}-win-x64-setup.exe" > SHA256SUMS-installer.txt
          cat SHA256SUMS-installer.txt
      - uses: actions/upload-artifact@v4
        with:
          name: YMCL-windows-x64-installer
          path: |
            YMCL-*-win-x64-setup.exe
            SHA256SUMS-installer.txt
          retention-days: 14

  linux-appimage:
    name: Linux · AppImage (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: version
        shell: bash
        run: |
          V=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null | sed 's/^v//')
          V=${V:-1.0.0}
          V=$(echo "$V" | cut -d. -f1-3)
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: createDistributable
        run: ./gradlew :composeApp:createDistributable -Pymcl.version=$VERSION --no-daemon --stacktrace
      - name: Build AppImage
        shell: bash
        run: |
          set -eu
          APP=composeApp/build/compose/binaries/main/app/YMCL
          APPDIR=YMCL.AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib/YMCL" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r "$APP"/* "$APPDIR/usr/lib/YMCL"/
          ln -sf usr/lib/YMCL/bin/YMCL "$APPDIR/usr/bin/YMCL"
          cp design/logo/ymcl-mark-light-256.png "$APPDIR/ymcl.png"
          cp design/logo/ymcl-mark-light-256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/ymcl.png"
          cat > "$APPDIR/YMCL.desktop" <<EOF
          [Desktop Entry]
          Name=YMCL
          Exec=YMCL
          Icon=ymcl
          Categories=Game;
          Terminal=false
          Type=Application
          EOF
          cat > "$APPDIR/AppRun" <<'EOF2'
          #!/bin/sh
          exec "$(dirname "$0")/usr/bin/YMCL" "$@"
          EOF2
          chmod +x "$APPDIR/AppRun"
          wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "YMCL-$VERSION-x86_64.AppImage"
          sha256sum "YMCL-$VERSION-x86_64.AppImage" > SHA256SUMS-appimage.txt
          cat SHA256SUMS-appimage.txt
      - uses: actions/upload-artifact@v4
        with:
          name: YMCL-linux-x86_64-appimage
          path: |
            YMCL-*-x86_64.AppImage
            SHA256SUMS-appimage.txt
          retention-days: 14

  windows-console-debug:
    name: Windows · console debug build (best effort)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: createDistributable (console)
        shell: bash
        run: ./gradlew :composeApp:createDistributable -Pymcl.console=true --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: YMCL-windows-x64-console-debug
          path: composeApp/build/compose/binaries/main/app/YMCL
          include-hidden-files: true
          retention-days: 14

  windows-msi:
    name: Windows · MSI installer (best effort)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: packageMsi
        shell: bash
        run: ./gradlew :composeApp:packageMsi --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: YMCL-windows-x64-msi
          path: composeApp/build/compose/binaries/main/pkg/*.msi
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub Release (v* tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows-portable, windows-installer, linux-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Build combined SHA256SUMS
        shell: bash
        run: |
          set -eu
          cd artifacts
          : > SHA256SUMS
          for f in YMCL-*.zip YMCL-*-setup.exe YMCL-*.AppImage; do
            [ -e "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            YMCL ${{ github.ref_name }} — unsigned build.

            **Windows SmartScreen will warn** ("Windows protected your PC"):
            choose **More info → Run anyway**. This is expected for unsigned
            builds; the binaries are built from this repository by CI.

            Artifacts (see SHA256SUMS for checksums):
            - `YMCL-<ver>-win-x64.exe` — single-file 7-Zip SFX. First launch
              unpacks to `%LOCALAPPDATA%\YMCL\<ver>` (takes ~1–3 seconds);
              later launches reuse the unpacked copy.
            - `YMCL-<ver>-win-x64-portable.zip` — portable folder, no install.
            - `YMCL-<ver>-x86_64.AppImage` — `chmod +x` then run (no FUSE needed).
            - `SHA256SUMS` — sha256 of every artifact above.

            Manual Windows checks: see `docs/p8-manual-checklist.md`.
          files: |
            artifacts/YMCL-*.zip
            artifacts/YMCL-*-setup.exe
            artifacts/YMCL-*.AppImage
            artifacts/SHA256SUMS
          fail_on_unmatched_files: false
